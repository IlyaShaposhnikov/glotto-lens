[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glotto-lens"
version = "0.1.0"
description = "Ask questions about the grammar of the world's languages: RAG over Grambank, WALS and Glottolog with verifiable answers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ilya Shaposhnikov" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "openai>=1.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
